<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dussehraBg" cx="50%" cy="26%" r="90%">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="35%" stop-color="#F57C00"/>
      <stop offset="68%" stop-color="#B7410E"/>
      <stop offset="100%" stop-color="#3D1409"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEFC2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFEFC2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blastGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE27A" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F57C00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F57C00" stop-opacity="0"/>
    </radialGradient>
    <g id="hSpark">
      <path d="M0,-10 L2,-2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2 Z" fill="#FFEFC2" opacity="0.9"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#dussehraBg)"/>
  <circle cx="400" cy="150" r="220" fill="url(#sunGlow)"/>
  <!-- sunburst rays -->
  <g stroke="#FFE9B8" stroke-width="3" opacity="0.25">
    <line x1="400" y1="150" x2="400" y2="10"/>
    <line x1="400" y1="150" x2="230" y2="40"/>
    <line x1="400" y1="150" x2="570" y2="40"/>
    <line x1="400" y1="150" x2="130" y2="120"/>
    <line x1="400" y1="150" x2="670" y2="120"/>
  </g>

  <rect x="18" y="18" width="764" height="464" rx="26" fill="none" stroke="#3D1409" stroke-width="3"/>
  <rect x="29" y="29" width="742" height="442" rx="19" fill="none" stroke="#D4A017" stroke-width="1.6" opacity="0.85"/>

  <!-- ground -->
  <path d="M18,458 Q400,486 782,458 L782,464 Q400,494 18,464 Z" fill="#2A0F06" opacity="0.55"/>
  <ellipse cx="230" cy="452" rx="120" ry="12" fill="#2A0F06" opacity="0.3"/>
  <ellipse cx="580" cy="452" rx="130" ry="12" fill="#2A0F06" opacity="0.3"/>

  <!-- ===== impact blast behind effigy ===== -->
  <circle cx="588" cy="248" r="120" fill="url(#blastGlow)"/>

  <!-- ===== RAVANA EFFIGY (right) ===== -->
  <g fill="#3D1409">
    <!-- pedestal -->
    <rect x="540" y="420" width="96" height="18" rx="4"/>
    <!-- legs -->
    <rect x="558" y="360" width="20" height="64" rx="8"/>
    <rect x="598" y="360" width="20" height="64" rx="8"/>
    <!-- robe / body -->
    <path d="M544,364 Q540,300 560,250 L616,250 Q636,300 632,364 Q588,380 544,364 Z"/>
    <!-- arms raised with weapons -->
    <path d="M556,270 Q520,240 500,190" stroke="#3D1409" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M620,270 Q656,240 676,190" stroke="#3D1409" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- mace -->
    <circle cx="498" cy="180" r="14"/>
    <rect x="493" y="180" width="10" height="40" rx="4"/>
    <!-- sword -->
    <path d="M676,188 L688,150 L682,148 L668,184 Z"/>
    <!-- ten heads, fanned -->
    <circle cx="588" cy="210" r="30"/>
    <circle cx="540" cy="196" r="20"/>
    <circle cx="500" cy="178" r="15"/>
    <circle cx="636" cy="196" r="20"/>
    <circle cx="676" cy="178" r="15"/>
    <circle cx="566" cy="168" r="15"/>
    <circle cx="610" cy="168" r="15"/>
  </g>
  <!-- crowns on the heads -->
  <g fill="#D4A017">
    <path d="M576,192 L580,182 L588,190 L596,182 L600,192 Z"/>
    <path d="M530,180 L533,172 L540,178 L547,172 L550,180 Z"/>
    <path d="M626,180 L629,172 L636,178 L643,172 L646,180 Z"/>
  </g>
  <!-- effigy on fire -->
  <g>
    <path d="M560,250 C556,224 570,206 588,192 C606,206 620,224 616,250 Z" fill="#F57C00" opacity="0.9"/>
    <path d="M572,246 C570,228 580,214 590,204 C600,214 608,228 606,246 Z" fill="#FFC24B"/>
    <path d="M582,240 C581,230 587,222 591,216 C596,222 601,230 600,240 Z" fill="#FFF3C9"/>
  </g>
  <use href="#hSpark" x="536" y="150"/>
  <use href="#hSpark" x="648" y="160"/>
  <use href="#hSpark" x="600" y="120"/>

  <!-- ===== ARROW mid-flight ===== -->
  <g>
    <path d="M280,300 L520,240" stroke="#FFE27A" stroke-width="2" opacity="0.55" stroke-dasharray="2 6"/>
    <line x1="430" y1="262" x2="520" y2="240" stroke="#3D1409" stroke-width="4" stroke-linecap="round"/>
    <path d="M520,240 L500,232 L502,244 Z" fill="#3D1409"/>
    <path d="M430,262 L414,256 L418,268 Z" fill="#D4A017"/>
  </g>

  <!-- ===== RAM, ARCHER (left) ===== -->
  <g fill="#3D1409">
    <!-- back leg, lunge -->
    <path d="M232,360 Q214,404 220,438 L246,438 Q252,400 258,362 Z"/>
    <!-- front leg -->
    <path d="M258,368 Q276,400 268,438 L294,438 Q300,398 284,360 Z"/>
    <!-- lower garment -->
    <path d="M226,330 Q216,362 234,372 L286,372 Q300,358 288,328 Q256,314 226,330 Z"/>
    <!-- torso -->
    <path d="M234,270 Q226,300 234,332 L284,332 Q294,298 286,268 Q260,254 234,270 Z"/>
    <!-- drawing arm, pulled back -->
    <path d="M270,284 Q300,278 322,262" stroke="#3D1409" stroke-width="15" fill="none" stroke-linecap="round"/>
    <!-- bow arm, extended forward -->
    <path d="M244,288 Q216,282 196,300" stroke="#3D1409" stroke-width="15" fill="none" stroke-linecap="round"/>
    <!-- neck + head -->
    <rect x="252" y="238" width="16" height="16" rx="6"/>
    <circle cx="260" cy="222" r="26"/>
    <!-- crown -->
    <path d="M236,206 L240,190 L250,202 L260,186 L270,202 L280,190 L284,206 Z"/>
    <circle cx="260" cy="186" r="4"/>
  </g>
  <!-- bow -->
  <path d="M196,240 Q168,300 196,362" stroke="#3D1409" stroke-width="6" fill="none" stroke-linecap="round"/>
  <line x1="196" y1="240" x2="322" y2="262" stroke="#D4A017" stroke-width="2" opacity="0.7"/>

  <use href="#hSpark" x="150" y="360"/>
  <use href="#hSpark" x="120" y="220"/>
  <use href="#hSpark" x="400" y="380"/>
</svg>
