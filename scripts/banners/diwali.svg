<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="diwaliBg" cx="50%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="38%" stop-color="#F5A623"/>
      <stop offset="70%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#5B1A0E"/>
    </radialGradient>
    <radialGradient id="diwaliGlow" cx="50%" cy="46%" r="30%">
      <stop offset="0%" stop-color="#FFF3C9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF3C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF9E0" stop-opacity="0"/>
    </radialGradient>
    <g id="dSpark">
      <path d="M0,-11 L2.2,-2.2 L11,0 L2.2,2.2 L0,11 L-2.2,2.2 L-11,0 L-2.2,-2.2 Z" fill="#FFF3C9" opacity="0.9"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#diwaliBg)"/>
  <g fill="#FFF3C9" opacity="0.22">
    <circle cx="70" cy="60" r="1.8"/><circle cx="150" cy="100" r="1.4"/><circle cx="230" cy="50" r="1.6"/>
    <circle cx="690" cy="70" r="1.8"/><circle cx="620" cy="110" r="1.4"/><circle cx="750" cy="120" r="1.6"/>
  </g>

  <rect x="18" y="18" width="764" height="464" rx="26" fill="none" stroke="#7A1F1F" stroke-width="3"/>
  <rect x="29" y="29" width="742" height="442" rx="19" fill="none" stroke="#E8B54A" stroke-width="1.6" opacity="0.85"/>

  <!-- string of festive lights across the top -->
  <path d="M50,90 Q400,150 750,90" fill="none" stroke="#7A1F1F" stroke-width="2.5" opacity="0.45"/>
  <g>
    <circle cx="120" cy="102" r="6" fill="#F5D889"/><circle cx="120" cy="102" r="10" fill="url(#sparkGlow)"/>
    <circle cx="230" cy="123" r="6" fill="#E85D75"/><circle cx="230" cy="123" r="10" fill="url(#sparkGlow)"/>
    <circle cx="340" cy="136" r="6" fill="#6FCF97"/><circle cx="340" cy="136" r="10" fill="url(#sparkGlow)"/>
    <circle cx="460" cy="136" r="6" fill="#F5D889"/><circle cx="460" cy="136" r="10" fill="url(#sparkGlow)"/>
    <circle cx="570" cy="123" r="6" fill="#7FB3E8"/><circle cx="570" cy="123" r="10" fill="url(#sparkGlow)"/>
    <circle cx="680" cy="102" r="6" fill="#E85D75"/><circle cx="680" cy="102" r="10" fill="url(#sparkGlow)"/>
  </g>

  <ellipse cx="400" cy="452" rx="210" ry="14" fill="#5B1210" opacity="0.22"/>

  <!-- ===== hero diya, center, bigger + brighter ===== -->
  <circle cx="400" cy="250" r="150" fill="url(#diwaliGlow)"/>
  <g transform="translate(400,272)">
    <ellipse cx="0" cy="16" rx="66" ry="10" fill="#4A0E0E" opacity="0.2"/>
    <path d="M-62,0 Q0,-34 62,0 Q50,15 0,15 Q-50,15 -62,0 Z" fill="#7A1F1F"/>
    <path d="M-62,0 Q0,-34 62,0" fill="none" stroke="#E8B54A" stroke-width="2" opacity="0.6"/>
    <rect x="-66" y="13" width="132" height="10" rx="5" fill="#5B1210"/>
    <path d="M0,-64 C15,-36 21,-17 0,0 C-21,-17 -15,-36 0,-64 Z" fill="#F5A623"/>
    <path d="M0,-46 C7,-31 9,-16 0,-4 C-9,-16 -7,-31 0,-46 Z" fill="#FFE27A"/>
    <path d="M0,-30 C4,-21 5,-11 0,-3 C-5,-11 -4,-21 0,-30 Z" fill="#FFF9E0"/>
  </g>

  <!-- ===== sparkler, lower-left ===== -->
  <g transform="translate(200,392) rotate(-8)">
    <rect x="-4" y="0" width="8" height="90" rx="4" fill="#8A5A2A"/>
    <g stroke="#FFE27A" stroke-width="3" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="0" x2="-26" y2="-30"/>
      <line x1="0" y1="0" x2="0" y2="-40"/>
      <line x1="0" y1="0" x2="24" y2="-32"/>
      <line x1="0" y1="0" x2="-14" y2="-14"/>
      <line x1="0" y1="0" x2="16" y2="-16"/>
    </g>
    <g fill="#FFF3C9">
      <circle cx="-26" cy="-30" r="2.6"/><circle cx="0" cy="-40" r="2.6"/><circle cx="24" cy="-32" r="2.6"/>
      <circle cx="-14" cy="-14" r="2"/><circle cx="16" cy="-16" r="2"/><circle cx="-6" cy="-24" r="2"/><circle cx="9" cy="-26" r="2"/>
    </g>
    <circle cx="0" cy="-4" r="14" fill="url(#sparkGlow)"/>
  </g>

  <!-- ===== anar (fountain cracker), lower-right ===== -->
  <g transform="translate(600,410)">
    <path d="M-22,0 L22,0 L16,34 L-16,34 Z" fill="#B7410E"/>
    <ellipse cx="0" cy="0" rx="22" ry="6" fill="#8A2E0A"/>
    <g stroke="#F5D889" stroke-width="3.4" stroke-linecap="round">
      <path d="M0,-2 C-6,-30 -18,-52 -34,-66" fill="none"/>
      <path d="M0,-2 C-2,-34 -2,-58 -6,-82" fill="none"/>
      <path d="M0,-2 C4,-32 10,-54 22,-70" fill="none"/>
      <path d="M0,-2 C10,-26 26,-42 44,-52" fill="none"/>
      <path d="M0,-2 C-10,-24 -24,-40 -44,-50" fill="none"/>
    </g>
    <g fill="#FFE27A">
      <circle cx="-34" cy="-66" r="3"/><circle cx="-6" cy="-82" r="3"/><circle cx="22" cy="-70" r="3"/>
      <circle cx="44" cy="-52" r="2.6"/><circle cx="-44" cy="-50" r="2.6"/>
    </g>
    <circle cx="0" cy="-30" r="30" fill="url(#sparkGlow)" opacity="0.7"/>
  </g>

  <!-- ===== sweets thali ===== -->
  <g transform="translate(400,438)">
    <ellipse cx="0" cy="6" rx="100" ry="17" fill="#E8B54A"/>
    <ellipse cx="0" cy="2" rx="100" ry="17" fill="#F5D889"/>
    <ellipse cx="0" cy="2" rx="80" ry="11" fill="#FBE9C8"/>
    <!-- laddoos -->
    <g>
      <circle cx="-52" cy="-6" r="16" fill="#F5A623"/>
      <circle cx="-52" cy="-6" r="16" fill="none" stroke="#C2410C" stroke-width="1" opacity="0.4"/>
      <g fill="#C2410C" opacity="0.5"><circle cx="-58" cy="-10" r="1.4"/><circle cx="-46" cy="-4" r="1.4"/><circle cx="-50" cy="-14" r="1.4"/><circle cx="-56" cy="0" r="1.4"/></g>
      <circle cx="-14" cy="-8" r="15" fill="#F5A623"/>
      <g fill="#C2410C" opacity="0.5"><circle cx="-20" cy="-12" r="1.4"/><circle cx="-9" cy="-6" r="1.4"/><circle cx="-13" cy="-15" r="1.4"/></g>
    </g>
    <!-- barfi (diamonds) -->
    <g transform="translate(38,-10) rotate(45)">
      <rect x="-14" y="-14" width="28" height="28" rx="3" fill="#FFE0C2"/>
      <rect x="-14" y="6" width="28" height="8" fill="#F2C08C"/>
    </g>
    <g transform="translate(72,-4) rotate(45)">
      <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#FBD5E0"/>
      <rect x="-12" y="5" width="24" height="7" fill="#EDA9BE"/>
    </g>
  </g>

  <use href="#dSpark" x="140" y="220"/>
  <use href="#dSpark" x="660" y="220"/>
  <use href="#dSpark" x="400" y="70"/>
</svg>
